# X-SetWarps Messages File v1.3
# Supports color codes (&a, &b, etc.) and hex colors (&#RRGGBB)

# General Messages
no-permission: "%prefix%&cYou do not have permission to use this command."
only-players: "%prefix%&cThis command can only be used by players."
usage-setwarp: "%prefix%&cUsage: /setwarp <name> [identifier] [description]"
usage-warp: "%prefix%&cUsage: /warp <name>"
usage-delwarp: "%prefix%&cUsage: /delwarp <name>"
usage-warpinfo: "%prefix%&cUsage: /warpinfo <name>"

# Warp Messages
warp-set: "%prefix%&aWarp '&b%warp%&a' has been set successfully!"
warp-not-found: "%prefix%&cWarp '&b%warp%&c' does not exist."
warp-teleport: "%prefix%&aTeleported to warp: &b%warp%"
warp-deleted: "%prefix%&aWarp '&b%warp%&a' has been deleted."
world-not-loaded: "%prefix%&cError: World '&b%world%&c' is not loaded."
reload-success: "%prefix%&aConfiguration and messages reloaded!"

# Warp List Messages
warp-cooldown: "%prefix%&cYou must wait &e%seconds%s &cbefore using &b%warp%&c again."
warp-delay: "%prefix%&eTeleporting to &b%warp% &ein &a%seconds% &eseconds... Don't move."
warp-delay-cancelled: "%prefix%&cTeleportation cancelled due to movement."
warps-limit-reached: "%prefix%&cMaximum warp limit reached (&e%limit%&c)."
warps-list-empty: "%prefix%&cNo warps registered."
warps-list-header: "&9&l--- Warps (&b%count%&9) ---"
warps-list-entry: "&7- &b%warp% &8(&7World: &f%world%&8) &7- &f%desc%"

# WarpInfo Messages
warpinfo-header: "&9&l--- Warp Info: &b%warp% ---"
warpinfo-desc: "&7Description: &f%desc%"
warpinfo-world: "&7World: &f%world%"
warpinfo-coords: "&7Coordinates: &f%coords%"
warpinfo-creator: "&7Created by: &f%creator%"
warpinfo-created: "&7Date: &f%date%"

# Update Checker Messages
update-check: "%prefix%&eChecking for updates..."
update-available: "%prefix%&eNew version! &7(&c%current%&7 -> &a%latest%&7)"
update-download: "&eDownload: &b%url%"
update-current: "%prefix%&aYou have the latest version!"
update-error: "%prefix%&cError checking for updates."
version-info: "%prefix%&bX-SetWarps &av%version%"

# Language Messages
language-changed: "%prefix%&aLanguage changed to: &b%language%"
language-not-found: "%prefix%&cLanguage not found. Available: %list%"
