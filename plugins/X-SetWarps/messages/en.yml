force-messages-reset-all: "&aRegenerated &e%count%&a language file(s) from defaults."
force-messages-invalid-mode: "&cInvalid mode. Use &enew&c or &ekeep&c."

# Help additions (forcemessages)
help-forcemessages: "&b/xsw forcemessages <new|keep> <all|lang> &f- Force update messages"